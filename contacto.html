<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <title>AltSonik Fest 2025</title>
        <link rel="stylesheet" href="style.css">
    </head>      
    <body>
      <header>
        <a href="index.html">
          <img  src="AltSonikFest.png" alt="AltSonikFest" id="AltSonikFest2025">
        </a>
        <h1>AltSonik Fest 2025</h1>
      </header>
      <nav class="hover-effect2">
          <ul>
           <li><a href="index.html">Inicio</a></li>
              <li><a href="artistas.html">Artistas</a></li>
              <li><a href="programa.html">Programa</a></li>
              <li><a href="contacto.html">Contacto</a></li>
         </ul>
      </nav>
      <div>
      <main class="hover-effect">
        <h2>Bienvenidos a AltSonikFest 2025</h2>
        <ul class="lista-contacto">
           <li><strong>Correo:</strong> info@altsonikfest.com</li>
           <li><strong>Teléfono:</strong> +34 600 123 456</li>
           <li><strong>Dirección:</strong> Barcelona, España</li>
           <li><strong>Instagram:</strong> @altsonikfest</li>
        </ul>
        <form class="formulario-contacto">
           <label for="nombre">Nombre Completo:</label>
           <input type="text" id="nombre" name="nombre" required>
           <label for="correo">Correo electrónico:</label>
           <input type="email" id="correo" name="correo" required>
           <label for="motivo">Motivo del contacto:</label>
           <select id="motivo" name="motivo" required>
             <option value="">Seleccione una opción</option>
             <option value="entradas">Información sobre entradas</option>
             <option value="artistas">Información sobre artistas</option>
             <option value="voluntariado">Voluntariado</option>
             <option value="otro">Otro</option>
           </select>
           <label for="mensaje">Mensaje:</label>
           <textarea id="mensaje" name="mensaje" rows="4" required></textarea>
           <button type="submit">Enviar</button>
        </form>
      </main>
      <footer class="hover-effect2">
        <p>  &copy; 2025 AltSonik Fest. Todos los derechos reservados.</p>
      </footer>
    </body>
</html>
